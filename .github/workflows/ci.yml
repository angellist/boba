name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Linters
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Ruby
        uses: ruby/setup-ruby@12fd324f1d0b43274fdc8130f6980590a667c455 # v1.131.0
        with:
          bundler-cache: true
      - name: Run type check
        run: bundle exec srb tc
      - name: Lint Ruby files
        run: bundle exec rubocop --fail-level error
      - name: Verify documentation
        run: bin/docs
      - name: Run tests
        run: bin/test
      - name: Verify gem RBIs are up-to-date
        run: bin/tapioca gem --verify
      - name: Verify duplicates in shims
        run: bin/tapioca check-shims
